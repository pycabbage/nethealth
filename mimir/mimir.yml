# Mimir 3.1.2 single-process config (local verification).
# multitenancy disabled so push/query work without an X-Scope-OrgID header.
multitenancy_enabled: false

server:
  http_listen_port: 9009
  grpc_listen_port: 9095
  log_level: info

# Shared object-storage connection (RustFS S3; insecure = plain HTTP). Per-component
# bucket names are set on each *_storage block, as Mimir requires a distinct bucket each.
common:
  storage:
    backend: s3
    s3:
      endpoint: rustfs:9000
      region: us-east-1
      access_key_id: nethealthadmin
      secret_access_key: nethealthsecretkey
      insecure: true

blocks_storage:
  s3:
    bucket_name: mimir-blocks
  # Node-local scratch (TSDB head/WAL, block-sync cache), not object storage.
  bucket_store:
    sync_dir: /data/tsdb-sync
  tsdb:
    dir: /data/tsdb

compactor:
  data_dir: /data/compactor
  sharding_ring:
    kvstore:
      store: memberlist

distributor:
  ring:
    kvstore:
      store: memberlist

ingester:
  ring:
    replication_factor: 1
    kvstore:
      store: memberlist

store_gateway:
  sharding_ring:
    replication_factor: 1
    kvstore:
      store: memberlist

ruler_storage:
  s3:
    bucket_name: mimir-ruler

# Single-node: no external members to join.
memberlist:
  join_members: []

# Relax limits for local testing.
limits:
  ingestion_rate: 100000
  ingestion_burst_size: 200000
  # Tolerate out-of-order samples from WSL2 wall-clock jumps. see docs/adr/0003-wsl2-wall-clock-tolerance.md
  out_of_order_time_window: 10m
  # Retain compacted blocks 31 days. Maps to -compactor.blocks-retention-period,
  # which in YAML must live under the per-tenant `limits` block.
  compactor_blocks_retention_period: 744h
