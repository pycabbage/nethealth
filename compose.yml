# Docker-side container log rotation (stdout/stderr), independent of TSDB/Loki data retention.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # S3-compatible object storage backing Mimir and Loki; not published to the host.
  rustfs:
    image: rustfs/rustfs:latest
    container_name: nethealth-rustfs
    environment:
      - RUSTFS_ACCESS_KEY=nethealthadmin
      - RUSTFS_SECRET_KEY=nethealthsecretkey
      - RUSTFS_REGION=us-east-1
      - RUSTFS_VOLUMES=/data
    volumes:
      - rustfs-data:/data
    healthcheck:
      # Ready once the S3 API port accepts connections (auth-independent).
      test: ["CMD-SHELL", "nc -z localhost 9000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped

  # One-shot bucket provisioning; RustFS and Mimir/Loki do not auto-create buckets.
  rustfs-init:
    image: minio/mc
    container_name: nethealth-rustfs-init
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      - MC_HOST_rustfs=http://nethealthadmin:nethealthsecretkey@rustfs:9000
    command: ["mb", "--ignore-existing", "rustfs/mimir-blocks", "rustfs/mimir-ruler", "rustfs/loki-data"]
    logging: *default-logging
    restart: "no"

  mimir:
    image: grafana/mimir:3.1.4
    container_name: nethealth-mimir
    depends_on:
      rustfs:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    command:
      - -config.file=/etc/mimir/mimir.yml
    volumes:
      - ./mimir/mimir.yml:/etc/mimir/mimir.yml:ro
      - mimir-data:/data
    logging: *default-logging
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7
    container_name: nethealth-loki
    depends_on:
      rustfs:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    command:
      - -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    logging: *default-logging
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1
    container_name: nethealth-grafana
    depends_on:
      mimir:
        condition: service_started
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_DEFAULT_THEME=dark
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    # Only Grafana is published to the host; host 3456 -> container 3000.
    ports:
      - "3456:3000"
    logging: *default-logging
    restart: unless-stopped

  # Grafana Alloy: OTLP relay. Receives OTLP/gRPC from the pinger and fans out to
  # Mimir (metrics) and Loki (logs). Not published to the host.
  alloy:
    image: grafana/alloy:v1.17.1
    container_name: nethealth-alloy
    depends_on:
      mimir:
        condition: service_started
      loki:
        condition: service_started
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
    logging: *default-logging
    restart: unless-stopped

  pinger:
    image: ghcr.io/pycabbage/nethealth/pinger
    build:
      context: ./pinger
    container_name: nethealth-pinger
    depends_on:
      alloy:
        condition: service_started
    environment:
      # OTLP/gRPC to Alloy, which relays to Mimir/Loki. see docs/adr/0005-otlp-alloy-relay-and-label-hygiene.md
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy:4317
      - OTEL_SERVICE_NAME=nethealth-pinger
    # root in the container, but confined: only NET_RAW, no privilege escalation,
    # read-only rootfs. see docs/adr/0007-non-root-runtime-file-capability.md
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    read_only: true
    logging: *default-logging
    restart: unless-stopped

volumes:
  rustfs-data:
  mimir-data:
  loki-data:
  grafana-data:
