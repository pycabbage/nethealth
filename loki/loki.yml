# Loki 3.7 single-binary config backed by RustFS S3 (chunks + TSDB index; local verification).
# auth disabled so push/query work without an X-Scope-OrgID header (matches Mimir).
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  # Chunks and TSDB index live in the RustFS S3 bucket. s3forcepathstyle: true is
  # required for MinIO-style servers (bucket in path); insecure = plain HTTP.
  storage:
    s3:
      endpoint: rustfs:9000
      region: us-east-1
      bucketnames: loki-data
      access_key_id: nethealthadmin
      secret_access_key: nethealthsecretkey
      s3forcepathstyle: true
      insecure: true
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  # Node-local scratch: the shipper's index working copy and cache (authoritative copy in S3).
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache

# Retain log streams 31 days; deletion is performed by the compactor (retention_enabled: true).
limits_config:
  retention_period: 744h
  # Tolerate WSL2 wall-clock jumps (don't reject slightly old lines). see docs/adr/0003-wsl2-wall-clock-tolerance.md
  reject_old_samples: false

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  # Store delete requests in the object store too, not the local filesystem.
  delete_request_store: s3
  compaction_interval: 10m

# Disable phone-home analytics for a self-contained local stack.
analytics:
  reporting_enabled: false
